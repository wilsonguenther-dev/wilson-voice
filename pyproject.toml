[project]
name = "wilson-voice"
version = "0.1.0"
description = "Local menubar dictation for Mac — Wispr Flow alternative using MLX Whisper"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Wilson Guenther" }]
dependencies = [
  "rumps>=0.4.0",
  "pynput>=1.7.6",
  "sounddevice>=0.4.6",
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.scripts]
wilson-voice = "wilson_voice.__main__:main"
wilson-voice-cli = "wilson_voice.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wilson_voice*"]
