name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# YV34 deleted the Python ASR sidecar (and with it the python-asr job that
# compiled + tested it). Transcription is native Rust now, so the Tauri job
# below is the whole gate.
jobs:
  desktop:
    name: Tauri build (Rust + frontend)
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend (tsc + vite)
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # YV60 made `desktop/` a Cargo workspace (src-tauri + yap-polish), so the
      # lockfile and target dir live there now.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # YV60: the polish sidecar is a SEPARATE link unit because the app already
      # statically links transcribe-cpp's ggml and llama-cpp-sys-2 vendors its
      # own. This step is the standing proof that the two never meet: if anyone
      # moves llama-cpp-2 into src-tauri, the duplicate ggml symbols fail here.
      # It runs FIRST because `bundle.externalBin` makes the staged binary a
      # precondition of every `cargo build` of the app, not just `tauri build`.
      - name: Build + stage the yap-polish sidecar
        working-directory: desktop
        run: |
          cargo build -p yap-polish --release
          TRIPLE="$(rustc -vV | awk '/^host:/ {print $2}')"
          mkdir -p src-tauri/binaries
          cp target/release/yap-polish "src-tauri/binaries/yap-polish-${TRIPLE}"
      # Reuses the artifacts just built, so this costs seconds. It runs the
      # protocol tests a SECOND time — from inside the sidecar, where the shared
      # `polish_protocol.rs` is compiled by the other end of the wire.
      - name: cargo test (yap-polish)
        working-directory: desktop
        run: cargo test -p yap-polish --release

      - name: rustfmt (informational)
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check || true
      - name: clippy (informational)
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --features custom-protocol || true

      # Build + tests are the gate. Lints are informational until the tree is clean.
      - name: cargo build (release, embedded frontend)
        working-directory: desktop/src-tauri
        run: cargo build --release --features custom-protocol
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --features custom-protocol
