name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# YV34 deleted the Python ASR sidecar (and with it the python-asr job that
# compiled + tested it). Transcription is native Rust now, so the Tauri job
# below is the whole gate.
jobs:
  desktop:
    name: Tauri build (Rust + frontend)
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend (tsc + vite)
        run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: rustfmt (informational)
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check || true
      - name: clippy (informational)
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --features custom-protocol || true

      # Build + tests are the gate. Lints are informational until the tree is clean.
      - name: cargo build (release, embedded frontend)
        working-directory: desktop/src-tauri
        run: cargo build --release --features custom-protocol
      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --features custom-protocol
