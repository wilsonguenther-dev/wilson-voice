name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# YV34 deleted the Python ASR sidecar (and with it the python-asr job that
# compiled + tested it). Transcription is native Rust now, so the Tauri job
# below is the whole gate.
jobs:
  desktop:
    name: Tauri build (Rust + frontend)
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend deps
        run: npm ci
      - name: Build frontend (tsc + vite)
        run: npm run build
      # YV71: the pill's live-commentary state machine (desktop/src/pill/live.ts)
      # is pure and unit-tested — a behavioural regression there shipped once
      # because a type check was the only frontend gate.
      - name: Frontend tests (vitest)
        run: npm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # YV60 made `desktop/` a Cargo workspace (src-tauri + yap-polish), so the
      # lockfile and target dir live there now.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # YV60/YV121: both sidecars are SEPARATE link units because the app
      # already statically links transcribe-cpp's ggml (and, through
      # `vad-rs`/`ort`, onnxruntime) while `llama-cpp-sys-2` and `sherpa-onnx`
      # each vendor their own copy of one of those. This step is the standing
      # proof that they never meet: if anyone moves llama-cpp-2 or sherpa-onnx
      # into src-tauri, the duplicate symbols fail here. It runs FIRST because
      # `bundle.externalBin` makes the staged binaries a precondition of every
      # `cargo build` of the app, not just `tauri build`.
      #
      # YV122 note — this step now FETCHES AT BUILD TIME. `sherpa-onnx-sys`'s
      # build script downloads
      # `sherpa-onnx-v1.13.4-osx-arm64-static-lib.tar.bz2` (19.5 MB) from
      # GitHub Releases into `desktop/target/sherpa-onnx-prebuilt/` whenever
      # `SHERPA_ONNX_LIB_DIR` is unset, and picks that URL from the SYS crate's
      # own version — which is why both halves are pinned exactly (see
      # `yap-diarize/Cargo.toml` and
      # `supply_chain.rs::diarize_sidecar_pins_sherpa_onnx_exactly`).
      #
      # That fetch is the open supply-chain item, and it is YV123's, per closed
      # decision O6. Two escape hatches exist and the cheaper one is not in the
      # plan's write-up: `SHERPA_ONNX_ARCHIVE_DIR` points at a directory holding
      # the vendored `.tar.bz2` and the build script extracts it itself, so a
      # checked-in archive + one env var is enough — `SHERPA_ONNX_LIB_DIR`
      # (which needs an already-extracted lib tree, produced and cached
      # somewhere) is not required.
      - name: Build + stage the sidecars (yap-polish, yap-diarize)
        working-directory: desktop
        run: |
          cargo build -p yap-polish -p yap-diarize --release
          TRIPLE="$(rustc -vV | awk '/^host:/ {print $2}')"
          mkdir -p src-tauri/binaries
          cp target/release/yap-polish "src-tauri/binaries/yap-polish-${TRIPLE}"
          cp target/release/yap-diarize "src-tauri/binaries/yap-diarize-${TRIPLE}"
      # Reuses the artifacts just built, so this costs seconds. It runs each
      # protocol's tests a SECOND time — from inside the sidecar, where the
      # shared `*_protocol.rs` is compiled by the other end of the wire.
      - name: cargo test (yap-polish)
        working-directory: desktop
        run: cargo test -p yap-polish --release
      - name: cargo test (yap-diarize)
        working-directory: desktop
        run: cargo test -p yap-diarize --release

      - name: rustfmt (informational)
        working-directory: desktop/src-tauri
        run: cargo fmt --all -- --check || true
      - name: clippy (informational)
        working-directory: desktop/src-tauri
        run: cargo clippy --all-targets --features custom-protocol || true

      # Build + tests are the gate. Lints are informational until the tree is clean.
      - name: cargo build (release, embedded frontend)
        working-directory: desktop/src-tauri
        run: cargo build --release --features custom-protocol

      # YV101 (plan finding OS-11). Yap's deployment floor is macOS 12.0, and
      # its dependency graph imports CoreAudio symbols that only exist on 13+
      # and 14.2+. A HARD import of one of those is a dyld failure for the whole
      # app on every macOS 12/13 machine — Yap does not open at all, and nothing
      # else in this workflow can see it: the build is green, the tests are
      # green, and the binary is unlaunchable for a whole population of users.
      # `build.rs` weak-links CoreAudio; this step is the standing proof, run
      # against the release Mach-O that was just built (never a debug build).
      - name: "ci: assert weak-linked 14.4 CoreAudio symbols"
        working-directory: ${{ github.workspace }}
        run: ./scripts/assert-weak-linked-14_4-symbols.sh desktop/target/release/wilson-voice

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test --features custom-protocol
