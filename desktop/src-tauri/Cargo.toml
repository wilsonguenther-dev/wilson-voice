[package]
name = "wilson-voice"
version = "0.8.0"
description = "Wilson Voice — local dictation desktop app (Wispr Flow alternative)"
authors = ["Wilson Guenther"]
edition = "2021"

[lib]
name = "wilson_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol is REQUIRED for production: without it tauri-build sets cfg(dev)
# and the app loads http://localhost:1420 → blank white window when Vite is not running.
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2"
# YV42: a second launch of Yap.app must never become a second PROCESS — two
# instances fight over the CGEvent FN tap, the global shortcuts, the pasteboard
# transaction and the SQLite WAL. This plugin hands the argv to the running app
# (which just focuses its window) and exits the duplicate. Registered FIRST in
# run(), the way Handy does it, so the guard is in place before any other plugin
# takes a lock the duplicate would also grab.
tauri-plugin-single-instance = "2.4.3"
# YV42 launch-at-login (macOS LaunchAgent), driven by the `autostart` setting so
# the toggle — not whatever a previous install wrote — is authoritative.
tauri-plugin-autostart = "2.5.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
dirs = "6"
# YV91 — `statvfs` for the meeting disk preflight + the 60s watchdog (matrix
# row #4). Already in the graph through cpal; declared because we call it.
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
core-foundation = "0.10"
cpal = "0.18.1"
hound = "3.5.1"
# RNNoise (pure-Rust, BSD-3, no shipped model asset) — steady-noise suppression
# over the captured clip before the 16 kHz downsample (YV12). default-features
# off drops its optional hdf5/ndarray/train tooling; we only need DenoiseState.
nnnoiseless = { version = "0.5.2", default-features = false }
# Silero VAD (YV36) voice isolation — the same crate + pinned fork Handy ships.
# It runs Silero v4 through `ort` (onnxruntime, statically linked — nothing to
# install) and is loaded ONCE at startup into a warm VAD held by the app state.
# It replaces the YV29 pure-Rust ONNX interpreter, which could never even
# analyse the Silero v5 graph ("Failed analyse for node #5 If_0") and re-loaded
# + re-failed on EVERY dictation (see src/vad.rs for the full history and the
# fallback rules). The model is cached under Application Support (once from
# a direct URL, then OFFLINE — never HuggingFace); a missing/broken model falls
# back safely to the energy-VAD path so an utterance is never lost.
# YV45: both git deps are pinned to the EXACT rev Cargo.lock resolves, not to a
# moving branch/default head — CI builds with plain `cargo build` (no --locked),
# so a branch head that moved would silently enter a release build. Bumping one
# is now a reviewable one-line rev change. (`tests/supply_chain.rs` enforces it.)
vad-rs = { git = "https://github.com/cjpais/vad-rs", rev = "2a412ed858695b9251f3f5a1a20d95b59fa7c498", default-features = false }
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", rev = "a3122e894383aa068ec5365a42994e3ac94ba1b6", version = "2.1.0" }
# Embedded ASR engine (YV30) — same crate + version Handy ships for GGUF/ggml
# native inference. Base dep is static CPU-only (no features); the macOS target
# table below adds the Metal backend, mirroring Handy's per-platform posture.
transcribe-cpp = { version = "0.1.3", default-features = false }
# Verified model downloader (YV30): resumable HTTP + mandatory sha256 check.
reqwest = { version = "0.13", features = ["stream"] }
sha2 = "0.10"
# YV123 archive extraction. Every other catalog entry is a single file that the
# sha256 gate hands straight to the engine; the pyannote segmentation model is
# published ONLY as `sherpa-onnx-pyannote-segmentation-3-0.tar.bz2` (verified
# against the release: no bare `.onnx` asset), and Wilson's closed O6 decision
# keeps the mirror byte-for-byte identical to that archive rather than
# pre-extracting it. So `models.rs::extract_tar_bz2` is the one decompression
# path in the app, and it runs ONLY on bytes whose sha256 already matched.
#
# `bzip2-rs` — not `bzip2`/`bzip2-sys` — because those link libbz2, and this
# codebase has spent two backlogs keeping a SECOND native C library out of the
# binary that already statically links ggml and onnxruntime (the exact hazard
# that forced `yap-polish` and `yap-diarize` out of process). `bzip2-rs` is a
# pure-Rust decoder whose only runtime deps are `crc32fast` + `tinyvec`, both
# pure Rust — the same "a well-known pure-Rust option" argument OS-8 used to
# pick `rubato`. Exact pins, and `tests/supply_chain.rs` walks the lockfile
# graph from `wilson-voice` and asserts no `bzip2`/`bzip2-sys` is reachable, so
# a feature flag or a transitive edge cannot defeat the choice silently.
tar = "=0.4.46"
bzip2-rs = "=0.1.2"
# YP2 licensing. Yap's license is an Ed25519-signed claims blob verified
# OFFLINE against a public key compiled into this binary (src/license.rs) —
# there is no license server on the hot path and no account system. dalek is the
# reference pure-Rust implementation; `verify_strict` is what rejects the
# small-order / non-canonical public keys a permissive verifier would wave
# through. default-features off keeps the RNG and the batch verifier out: this
# app only ever VERIFIES, and the signing half lives root-only on the issuer box.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
# License keys travel as base64url through email and a paste buffer. Already in
# the graph via reqwest; declared here because we decode it ourselves.
base64 = "0.22"
# Tauri already pulls tokio; "time" adds the stall-timeout/backoff primitives.
tokio = { version = "1", features = ["time"] }

[target.'cfg(target_os = "macos")'.dependencies]
transcribe-cpp = { version = "0.1.3", default-features = false, features = ["metal"] }
# YV39 receipt-sequenced paste: `declareTypes:owner:` publishes the transcript
# as a lazy NSPasteboard promise, and the owner's provideDataForType: callback
# is the read receipt that gates the clipboard restore (see src/paste_tx.rs).
# Versions track what Tauri already pulls in — no new crates enter the graph.
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# YV100 (22-B) — the CoreAudio process tap. EXACT pin, no caret: this crate is
# the only thing standing between us and hand-rolled `AudioHardwareCreateProcessTap`
# FFI, its 14.4-era symbols are the ones YV101 weak-links, and a silent minor
# bump would move that symbol set under a signed bundle with no reviewable diff.
# Default features are load-bearing (plan finding OS-6): 12 of its 13 features
# are default-on and carry `AudioHardware` + `objc2` + `block2` + `dispatch2`,
# and ANY `default-features = false` anywhere in the graph deletes
# `AudioHardwareCreateProcessTap` outright. `tests/supply_chain.rs` asserts both
# the pin and the feature set, because a version pin with no feature assertion
# is decorative.
objc2-core-audio = "=0.3.2"
# OS-6's correction #1: `AudioDeviceCreateIOProcIDWithBlock` takes a
# `block2::RcBlock` and a `dispatch2::DispatchQueue`, and its buffer/timestamp
# arguments are `objc2-core-audio-types`. All three already arrive transitively
# through the pin above and add NOTHING to the dependency graph — they are
# declared because `syscapture.rs` names them, and Rust cannot name a crate it
# does not declare. Pinned exactly, for the same reason and to the same versions
# `objc2-core-audio` 0.3.2's own ranges resolve to.
block2 = "=0.6.2"
dispatch2 = "=0.3.1"
objc2-core-audio-types = "=0.3.2"

[features]
default = ["custom-protocol", "macos-private-api"]
custom-protocol = ["tauri/custom-protocol"]
macos-private-api = ["tauri/macos-private-api"]
# YV129 — the seal on the enrollment bands. `EnrollmentBands::for_test` is the
# only constructor that takes two literal edges, and it exists ONLY under
# `cfg(test)` or this feature. Nothing turns it on for `cargo build`, so a
# shipping call site that tries to hand-place a band is a compile error rather
# than something a scanner has to catch by name — which is exactly how the
# first version of that gate was defeated (a rename plus one level of
# indirection). See `src/speaker_profiles.rs`'s module header.
test-bands = []

[dev-dependencies]
# Not a real dependency: a package may depend on ITSELF as a dev-dependency to
# turn a feature on for test targets only. This is what makes `cargo test` (and
# `cargo clippy --all-targets`) see `EnrollmentBands::for_test` while
# `cargo build --release --features custom-protocol` — the CI gate that builds
# the shipping binary — does not. Integration tests need no extra flags.
wilson-voice = { path = ".", features = ["test-bands"] }
# YV129 — the EER-status mirror carries a committed digest, so a hand-edit of
# the block the tuning gate reads is a second, deliberate line in the diff.
sha2 = "0.10"
