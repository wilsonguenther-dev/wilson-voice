[package]
name = "wilson-voice"
version = "0.5.5"
description = "Wilson Voice — local dictation desktop app (Wispr Flow alternative)"
authors = ["Wilson Guenther"]
edition = "2021"

[lib]
name = "wilson_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol is REQUIRED for production: without it tauri-build sets cfg(dev)
# and the app loads http://localhost:1420 → blank white window when Vite is not running.
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-updater = "2"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
core-foundation = "0.10"
cpal = "0.18.1"
hound = "3.5.1"
# RNNoise (pure-Rust, BSD-3, no shipped model asset) — steady-noise suppression
# over the captured clip before the 16 kHz downsample (YV12). default-features
# off drops its optional hdf5/ndarray/train tooling; we only need DenoiseState.
nnnoiseless = { version = "0.5.2", default-features = false }
# Silero VAD (YV29) voice isolation — pure-Rust ONNX inference via tract (no
# native onnxruntime/ort dylib, so it links cleanly into the app + CI). The small
# Silero VAD onnx model is loaded from Application Support (downloaded once from a
# direct URL, then OFFLINE — never HuggingFace); a missing/broken model falls back
# safely to the energy-VAD path so an utterance is never lost.
tract-onnx = "0.21"
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1", version = "2.1.0" }

[features]
default = ["custom-protocol", "macos-private-api"]
custom-protocol = ["tauri/custom-protocol"]
macos-private-api = ["tauri/macos-private-api"]
