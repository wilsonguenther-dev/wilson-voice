[package]
name = "wilson-voice"
version = "0.5.4"
description = "Wilson Voice — local dictation desktop app (Wispr Flow alternative)"
authors = ["Wilson Guenther"]
edition = "2021"

[lib]
name = "wilson_voice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# custom-protocol is REQUIRED for production: without it tauri-build sets cfg(dev)
# and the app loads http://localhost:1420 → blank white window when Vite is not running.
tauri = { version = "2", features = ["tray-icon", "image-png", "custom-protocol", "macos-private-api"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-shell = "2.3.5"
tauri-plugin-fs = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-store = "2.4.3"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
dirs = "6"
rusqlite = { version = "0.32", features = ["bundled"] }
core-foundation = "0.10"
cpal = "0.18.1"
hound = "3.5.1"
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
block2 = "0.6.2"

[features]
default = ["custom-protocol", "macos-private-api"]
custom-protocol = ["tauri/custom-protocol"]
macos-private-api = ["tauri/macos-private-api"]
